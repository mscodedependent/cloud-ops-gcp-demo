name: PR Plan

on:
  pull_request:
    paths: ["infra/**"]

permissions:
  id-token: write
  contents: read
  pull-requests: write

jobs:
  plan:
    strategy:
      matrix:
        env: [dev]
    runs-on: ubuntu-latest
    env:
      TF_VAR_db_password: ${{ secrets[format('DB_PASSWORD_{0}', matrix.env)] }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars[format('WIF_PROVIDER_{0}', matrix.env)] }}
          service_account: ${{ vars[format('RUNNER_SA_{0}', matrix.env)] }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - run: terraform -chdir=infra/environments/${{ matrix.env }} fmt -check
      - run: terraform -chdir=infra/environments/${{ matrix.env }} init
      - run: terraform -chdir=infra/environments/${{ matrix.env }} validate

      - uses: terraform-linters/setup-tflint@v4
      - run: tflint --chdir=infra/environments/${{ matrix.env }} --recursive --init
      - run: tflint --chdir=infra/environments/${{ matrix.env }} --recursive
      - uses: bridgecrewio/checkov-action@master
        with:
          directory: infra/
          soft_fail: false
          # CKV_GCP_84: Google-managed encryption is sufficient here; CSEK adds KMS
          #   operational overhead not justified for this project.
          # CKV_GCP_79: Pinned to POSTGRES_15 deliberately; major-version upgrades are
          #   handled as a planned migration, not a reactive lint fix.
          # CKV_GCP_6: SSL is enforced via ssl_mode = "ENCRYPTED_ONLY" (the modern
          #   attribute); this checkov version's policy still only recognizes the
          #   deprecated require_ssl attribute, so it flags a false negative.
          skip_check: CKV_GCP_84,CKV_GCP_79,CKV_GCP_6
      - run: |
          terraform -chdir=infra/environments/${{ matrix.env }} plan -no-color -out=tfplan | tee plan-${{ matrix.env }}.txt

      - uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('plan-${{ matrix.env }}.txt', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `### Terraform plan — ${{ matrix.env }}\n\`\`\`\n${plan}\n\`\`\``
            });    