name: Apply Prod

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: prod
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD_PROD }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_PROD }}
          service_account: ${{ vars.RUNNER_SA_PROD }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - run: terraform -chdir=infra/environments/prod init

      - run: |
          set -o pipefail
          terraform -chdir=infra/environments/prod apply -auto-approve -no-color 2>&1 | tee apply-prod.txt
