name: Apply Staging

on:
  push:
    branches: [main]
    paths: ["infra/**"]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    environment: staging
    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD_STAGING }}
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER_STAGING }}
          service_account: ${{ vars.RUNNER_SA_STAGING }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"

      - run: terraform -chdir=infra/environments/staging init

      - run: |
          set -o pipefail
          terraform -chdir=infra/environments/staging apply -auto-approve -no-color 2>&1 | tee apply-staging.txt
